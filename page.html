<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SkillBridge</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="SkillBridge — обучение цифровым профессиям и выход на удалённую работу: диагностика, курсы, наставники, сертификация, заказы.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=PT+Serif:wght@700&display=swap">
<style>
/* Layout: a quiet, mobile-first page that walks the reader along the learning path — tracks, stages, who it's for, specialists, companies, enrolment. */
:root{
  --bg:#f7f8f6; --surface:#ffffff; --ink:#18221d; --muted:#5b6862; --line:#dfe4df;
  --accent:#1f6b4f; --accent-ink:#ffffff; --soft:#e8f1ec; --warn:#a33a2c; --warn-soft:#f8e7e3; --amber:#8a5a00; --amber-soft:#f8efd9;
  --font:"Golos Text","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111714; --surface:#18201c; --ink:#e7ede9; --muted:#9eaba4; --line:#29342e;
  --accent:#62c29a; --accent-ink:#0d1a14; --soft:#1c2d25; --warn:#e8806f; --warn-soft:#35201c; --amber:#e5b75a; --amber-soft:#332a17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111714; --surface:#18201c; --ink:#e7ede9; --muted:#9eaba4; --line:#29342e;
  --accent:#62c29a; --accent-ink:#0d1a14; --soft:#1c2d25; --warn:#e8806f; --warn-soft:#35201c; --amber:#e5b75a; --amber-soft:#332a17; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55}
[hidden]{display:none!important}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:clamp(28px,4.6vw,44px);font-weight:700;letter-spacing:-.01em}
h2{font-size:clamp(20px,2.6vw,26px);font-weight:700}
h3{font-size:16px;font-weight:600}
p{margin:0}
a{color:var(--accent)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;text-decoration:none;color:var(--ink);flex:none}
.logo svg{width:28px;height:16px}
.nav{display:flex;gap:18px;font-size:14px}
.nav a{color:var(--muted);text-decoration:none}
.nav a:hover{color:var(--ink)}
.right{display:flex;gap:8px;align-items:center}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{border:0;background:var(--surface);color:var(--muted);font:600 12px var(--font);padding:6px 10px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:8px;padding:11px 18px;font:600 14px var(--font);cursor:pointer;text-decoration:none}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-line{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn-danger{background:var(--surface);color:var(--warn);border:1px solid var(--line)}
.btn-sm{padding:7px 12px;font-size:13px}
.btn:disabled{opacity:.6;cursor:default}
:is(.btn,.lang button,.chip,input,select,textarea,.tab,a):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.lead{color:var(--muted);font-size:clamp(16px,1.8vw,18px);max-width:62ch}
.hero{padding-block:44px 36px;display:grid;gap:16px}
.ctas{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.path{list-style:none;margin:20px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.path li{padding:14px 16px;display:grid;gap:2px;position:relative;min-width:0}
.path li+li{border-left:1px solid var(--line)}
.path b{font-size:14px}
.path span{font-size:13px;color:var(--muted)}
.path .n{font-size:12px;font-weight:700;color:var(--accent)}
section{padding-block:40px;border-top:1px solid var(--line)}
.sec-head{display:grid;gap:8px;margin-bottom:22px;max-width:66ch}
.sec-head p{color:var(--muted)}
.tracks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.track{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:10px;align-content:start;min-width:0}
.track .skills{font-size:13px;color:var(--muted)}
.hsearch{position:relative;max-width:640px;margin-top:6px}
.hsinput{font-size:16px;padding:14px 16px;border-radius:10px;background:var(--surface)}
.hres{margin-top:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;display:grid;gap:2px;max-height:420px;overflow:auto}
.hlabel{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 8px 2px}
.hitem{display:grid;gap:2px;text-align:left;border:0;background:transparent;color:var(--ink);font:inherit;padding:8px;border-radius:8px;cursor:pointer}
.hitem:hover,.hitem:focus-visible{background:var(--soft)}
.hitem b{font-weight:600;font-size:14px}
.hitem span{font-size:13px;color:var(--muted)}
.hmore{border:0;background:transparent;color:var(--accent);font:600 13px var(--font);padding:8px;text-align:left;cursor:pointer}
.thead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tgroup{font-size:12px;color:var(--muted)}
.track.main{border-color:var(--accent)}
.track.flash{box-shadow:0 0 0 3px var(--accent)}
.more{display:flex;justify-content:center;margin-top:16px}
.more:empty{display:none}
.facts{display:grid;gap:4px;font-size:13px;margin:0}
.facts div{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:6px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--muted);margin-top:12px}
.stages{list-style:none;margin:0;padding:0;display:grid;gap:0}
.stage{display:grid;grid-template-columns:120px minmax(0,1fr) minmax(0,.8fr);gap:16px;padding:16px 0;border-top:1px solid var(--line)}
.stage:last-child{border-bottom:1px solid var(--line)}
.stage .when{font-size:13px;color:var(--muted)}
.stage .when b{display:block;color:var(--ink);font-size:15px}
.stage p{color:var(--muted);font-size:14px}
.stage .out{font-size:14px;font-weight:600;color:var(--accent)}
.stage .out small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.audience{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.aud{border-left:2px solid var(--accent);padding:4px 0 4px 14px;display:grid;gap:4px}
.aud p{font-size:14px;color:var(--muted)}
.features{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 24px;margin-top:28px}
.feature{display:grid;gap:4px}
.feature p{font-size:14px;color:var(--muted)}
.tools{display:grid;gap:12px;padding-bottom:16px}
.search{max-width:520px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 13px var(--font);padding:6px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--soft);border-color:var(--accent);color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;padding-bottom:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:10px;align-content:start;min-width:0}
.card .top{display:flex;gap:12px;align-items:center}
.ava{width:40px;height:40px;border-radius:50%;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:none}
.who{min-width:0}
.role{color:var(--muted);font-size:13px}
.skills{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.price{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.sample{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.empty{padding:20px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);text-align:center}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:32px;align-items:start}
.points{margin:0;padding:0;list-style:none;display:grid;gap:14px}
.points li{display:grid;gap:2px}
.points p{color:var(--muted);font-size:14px}
.formbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:14px;min-width:0}
.narrow{max-width:480px;margin-inline:auto}
form{display:grid;gap:12px}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
label{display:grid;gap:4px;font-size:13px;font-weight:500}
input,select,textarea{width:100%;font:400 14px var(--font);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
textarea{min-height:90px;resize:vertical}
.hint{font-size:13px;color:var(--muted)}
.err{font-size:13px;color:var(--warn)}
.ok{border:1px solid var(--accent);background:var(--soft);border-radius:8px;padding:12px;font-size:14px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.tgw{min-height:44px}
.demo{font-size:13px;color:var(--amber);background:var(--amber-soft);border-radius:8px;padding:10px 12px}
.cab{padding-block:28px;display:grid;gap:18px}
.cabhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.userline{display:flex;align-items:center;gap:12px;min-width:0}
.userline img{width:44px;height:44px;border-radius:50%}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px}
.tab{border:1px solid var(--line);background:transparent;color:var(--ink);font:600 13px var(--font);padding:8px 14px;border-radius:8px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.list{display:grid;gap:10px}
.ocard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:8px;min-width:0}
.ohead{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.otask{white-space:pre-wrap;overflow-wrap:anywhere}
.ometa{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.badge{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.b-new,.b-pending{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.b-accepted,.b-approved,.b-contacted{background:var(--soft);color:var(--accent);border-color:transparent}
.b-done{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.b-declined,.b-cancelled,.b-rejected{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.stats{display:flex;gap:24px;flex-wrap:wrap}
.stats b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stats span{font-size:13px;color:var(--muted)}
footer{padding-block:24px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

.crs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.crs .track h3 a{color:inherit;text-decoration:none}
.crs .track h3 a:hover{text-decoration:underline}
.cmeta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted)}
.bar2{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar2 i{display:block;height:100%;background:var(--accent);border-radius:99px}
.prog{border:1px dashed var(--accent);border-radius:12px;padding:18px;display:grid;gap:8px;margin-top:12px;background:var(--surface)}
.page{padding-block:28px 40px;display:grid;gap:18px}
.crumbs{font-size:13px;color:var(--muted)}
.crumbs a{color:var(--muted)}
.outline{list-style:none;margin:0;padding:0;display:grid;gap:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.outline li+li{border-top:1px solid var(--line)}
.outline a,.outline span.row1{display:flex;gap:12px;align-items:center;padding:12px 14px;color:var(--ink);text-decoration:none}
.outline a:hover{background:var(--soft)}
.outline a[aria-current="page"]{background:var(--soft);font-weight:600}
.mark{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;border:1.5px solid var(--line);color:var(--muted);flex:none}
.mark.ok{background:var(--accent);border-color:var(--accent);color:transparent;font-size:0;position:relative}
.mark.ok::after{content:"";position:absolute;left:6px;top:6px;width:8px;height:4px;border-left:2px solid var(--accent-ink);border-bottom:2px solid var(--accent-ink);transform:rotate(-45deg)}
.learn{display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px;align-items:start}
.learn aside{position:sticky;top:72px}
.lesson{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;display:grid;gap:14px;min-width:0}
.md{display:grid;gap:12px;font-size:16px;line-height:1.65;max-width:72ch}
.md h3{font-size:18px;margin-top:6px}
.md ul,.md ol{margin:0;padding-left:22px;display:grid;gap:4px}
.md code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.9em;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.md pre{margin:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow-x:auto}
.md pre code{border:0;padding:0;background:none;font-size:13px;line-height:1.5}
.quiz{display:grid;gap:16px;border-top:1px solid var(--line);padding-top:18px}
.qitem{display:grid;gap:8px;border:0;margin:0;padding:0;min-width:0}
.qitem legend{font-weight:600;padding:0;margin-bottom:6px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-weight:400;font-size:15px}
.opt input{width:auto;margin-top:3px}
.opt:has(input:checked){border-color:var(--accent);background:var(--soft)}
.qitem.right .opt:has(input:checked){border-color:var(--accent)}
.qitem.wrong .opt:has(input:checked){border-color:var(--warn);background:var(--warn-soft)}
.qres{font-size:13px;font-weight:600}
.qitem.right .qres{color:var(--accent)} .qitem.wrong .qres{color:var(--warn)}
.navrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.certwrap{display:grid;gap:14px;justify-items:center}
.certdoc{container-type:inline-size;width:100%;max-width:960px;aspect-ratio:297/210;background:#fff;color:#18221d;border-radius:6px;box-shadow:0 1px 0 #dfe4df,0 10px 40px rgba(0,0,0,.08);position:relative;overflow:hidden}
.certdoc .frame{position:absolute;inset:3cqi;border:.25cqi solid #1f6b4f;outline:.12cqi solid #1f6b4f;outline-offset:-.9cqi;display:grid;grid-template-rows:auto 1fr auto;padding:4cqi 6cqi 3.4cqi}
.certdoc .ctop{display:flex;justify-content:space-between;align-items:center;font-size:1.6cqi;color:#5b6862}
.certdoc .ctop b{display:flex;align-items:center;gap:1cqi;font-size:2.2cqi;color:#18221d}
.certdoc .ctop svg{width:3.6cqi;height:2cqi}
.certdoc .cmid{display:grid;align-content:center;justify-items:center;text-align:center;gap:1.4cqi}
.certdoc .ckind{font-size:5.2cqi;font-weight:700;letter-spacing:.18em;color:#1f6b4f}
.certdoc .cno{font-size:1.6cqi;color:#5b6862;letter-spacing:.06em}
.certdoc .ctext{font-size:1.9cqi;color:#5b6862}
.certdoc .cname{font-size:4.4cqi;font-weight:700;line-height:1.15;border-bottom:.15cqi solid #dfe4df;padding:0 4cqi .8cqi}
.certdoc .ctitle{font-size:2.8cqi;font-weight:600;max-width:80%}
.certdoc .cfacts{display:flex;gap:4cqi;font-size:1.7cqi;color:#5b6862}
.certdoc .cfacts b{display:block;color:#18221d;font-size:2.1cqi}
.certdoc .cbot{display:flex;justify-content:space-between;align-items:flex-end;gap:3cqi;font-size:1.35cqi;color:#5b6862}
.certdoc .signbox{display:grid;justify-items:center;width:32cqi}
.certdoc .sigimg{width:27cqi;height:auto;margin:0 0 -.7cqi 3cqi;position:relative;z-index:1}
.certdoc .sigline{width:100%;border-top:.14cqi solid #8a6d2b}
.certdoc .signname{font-family:"PT Serif",Georgia,serif;font-size:2.3cqi;font-weight:700;color:#18221d;margin-top:.9cqi}
.certdoc .sign{font-family:"PT Serif",Georgia,serif;font-size:1.5cqi;color:#5b6862;margin-top:.2cqi}
.certdoc .cnote{max-width:46cqi}
.revoked{position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,255,255,.72);font-size:6cqi;font-weight:700;color:#a33a2c;letter-spacing:.1em;transform:rotate(-8deg)}
.verify{display:flex;gap:8px;flex-wrap:wrap;max-width:520px}
.verify input{flex:1;min-width:200px;text-transform:uppercase}
@media (max-width:900px){.crs{grid-template-columns:repeat(2,minmax(0,1fr))}.learn{grid-template-columns:1fr}.learn aside{position:static}}
@media (max-width:640px){.crs{grid-template-columns:1fr}.lesson{padding:16px}}
@media print{
  @page{size:A4 landscape;margin:0}
  header,footer,.noprint{display:none!important}
  body{background:#fff}
  .page{padding:0}
  .certdoc{max-width:none;width:297mm;height:210mm;aspect-ratio:auto;box-shadow:none;border-radius:0}
}
@media (max-width:900px){.nav{display:none}.tracks,.features{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}}
@media (max-width:640px){
  .row,.tracks,.features{grid-template-columns:1fr}
  .path{grid-template-columns:repeat(2,minmax(0,1fr))}
  .path li:nth-child(3){border-left:0}
  .path li:nth-child(n+3){border-top:1px solid var(--line)}
  .stage{grid-template-columns:1fr;gap:6px}
}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <a class="logo" href="/" id="logo">
      <svg viewBox="0 0 28 16" aria-hidden="true"><path d="M1 15H27" stroke="currentColor" stroke-width="2"/><path d="M4 15Q14 -1 24 15" fill="none" stroke="var(--accent)" stroke-width="2"/></svg>
      SkillBridge
    </a>
    <nav class="nav" id="nav-links" aria-label="Sections"></nav>
    <div class="right">
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="ru" aria-pressed="true">RU</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <a class="btn btn-line btn-sm" id="nav" href="/cabinet">Войти</a>
    </div>
  </div>
</header>
<main id="app"></main>
<footer><div class="wrap foot"><span id="foot-l">© 2026 SkillBridge</span><span id="foot-r"></span></div></footer>

<script>
var BOT = "__BOT_USERNAME__";
var SIGNATURE = "__SIGNATURE__";
// Preview without a server (e.g. inside Claude): sample data, no login.
var DEMO = false;

var CATS = [
  {id:"all", ru:"Все", en:"All"},
  {id:"dev", ru:"Разработка", en:"Development"},
  {id:"marketing", ru:"Маркетинг и SMM", en:"Marketing & SMM"},
  {id:"design", ru:"Дизайн", en:"Design"},
  {id:"data", ru:"Данные", en:"Data"},
  {id:"lang", ru:"Английский и переводы", en:"English & translation"},
  {id:"cloud", ru:"Cloud и DevOps", en:"Cloud & DevOps"},
  {id:"video", ru:"Видео", en:"Video"},

// longer words also match a shorter stem ("дизайнер" finds "дизайн").
function hit(hay, q) {
  var hw = hay.split(/[^0-9a-zа-яґәөүұқғҳҷӣӯ#+]+/i).filter(Boolean);
  var words = norm(q).split(/[^0-9a-zа-яґәөүұқғҳҷӣӯ#+]+/i).filter(Boolean);
  return words.length > 0 && words.every(function (w) {
    return hw.some(function (x) {
      if (x.indexOf(w) === 0) return true;
      return w.length >= 5 && x.length >= 4 && w.indexOf(x.slice(0, Math.max(4, x.length - 2))) === 0;
    });
  });
}

function h(tag, attrs) {

async function api(path, body) {
  if (DEMO) {
    var dl = demoLearning(path, body);
    if (dl) return dl;
    if (path === "/api/me") return { user: null };
    if (path === "/api/specialists") return { specialists: SAMPLE };
    if (path === "/api/leads") return { ok: true };
    var de = new Error("demo"); de.status = 401; throw de;
  }
  var opt = body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
  var r = await fetch(path, opt), data = {};
  try { data = await r.json(); } catch (e) {}
  if (!r.ok) { var err = new Error(data.error || ("HTTP " + r.status)); err.status = r.status; throw err; }
  return data;
}

function esc(x) { return String(x).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function inline(x) {
  return esc(x)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
// Small markdown subset for lesson texts: ### headings, paragraphs, * / - lists, 1. lists, ``` code blocks, `code`, **bold**, [links](https://…).
function md(text) {
  var out = [], lines = String(text || "").split("\n"), i = 0;
  while (i < lines.length) {
    var ln = lines[i];
    if (/^```/.test(ln)) {
      var code = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) code.push(lines[i++]);
      i++; out.push("<pre><code>" + esc(code.join("\n")) + "</code></pre>"); continue;
    }
    if (/^###\s+/.test(ln)) { out.push("<h3>" + inline(ln.replace(/^###\s+/, "")) + "</h3>"); i++; continue; }
    if (/^[*-]\s+/.test(ln)) {
      var items = [];
      while (i < lines.length && /^[*-]\s+/.test(lines[i])) items.push("<li>" + inline(lines[i++].replace(/^[*-]\s+/, "")) + "</li>");
      out.push("<ul>" + items.join("") + "</ul>"); continue;
    }
    if (/^\d+\.\s+/.test(ln)) {
      var oi = [];
      while (i < lines.length && /^\d+\.\s+/.test(lines[i])) oi.push("<li>" + inline(lines[i++].replace(/^\d+\.\s+/, "")) + "</li>");
      out.push("<ol>" + oi.join("") + "</ol>"); continue;
    }
    if (!ln.trim()) { i++; continue; }
    var para = [];
    while (i < lines.length && lines[i].trim() && !/^(```|###\s|[*-]\s|\d+\.\s)/.test(lines[i])) para.push(lines[i++]);
    out.push("<p>" + inline(para.join(" ")) + "</p>");
  }
  var d = h("div", { class: "md" }); d.innerHTML = out.join(""); return d;
}

        if (cert("program", p.slug) || !p.courses.every(function (s) { return cert("course", s); })) return;
        var pc = newCode(), hrs = p.courses.reduce(function (a, s) { return a + find(s).hours; }, 0);
        var sc = Math.round(p.courses.reduce(function (a, s) { return a + cert("course", s).score; }, 0) / p.courses.length);
        demoState.certs.push({ code: pc, kind: "program", ref: p.slug, title: p.title, full_name: body.full_name, hours: hrs, score: sc, issued_at: today, revoked: 0,
          courses: p.courses.map(function (s) { return find(s).title; }) });
        progs.push(pc);
      });
    }
    return Promise.resolve({ score: g3.score, right: g3.right, total: g3.total, passed: passed, certificate: passed ? code : null, programs: progs, attemptsLeft: left - 1 });
  }
  if ((m = path.match(/^\/api\/certs\/([A-Z0-9-]+)$/))) {
    var found = demoState.certs.find(function (c) { return c.code === m[1]; });
    if (found) return Promise.resolve({ certificate: found });
    if (m[1] === "SB-2026-SAMPLE01") return Promise.resolve({ certificate: { code: "SB-2026-SAMPLE01", kind: "course", ref: "excel", title: C[1].title, full_name: "Имя Фамилия", hours: C[1].hours, score: 88, issued_at: "2026-10-15 10:00:00", revoked: 0 } });
    return Promise.reject(nf);
  }
  return null;
}

// ---------------- cabinet ----------------
function badge(kind, status) { return h("span", { class: "badge b-" + status, text: t(kind + "_" + status) }); }
function fmtDate(s) { return s ? s.slice(0, 16).replace("T", " ") : ""; }
function personName(first, last, username) {
  return [first, last].filter(Boolean).join(" ") + (username ? " (@" + username + ")" : "");
}
function trackName(id) { for (var i = 0; i < TRACKS.length; i++) if (TRACKS[i].id === id) return L(TRACKS[i]); return id; }

function renderCabinet() {
  var w = h("div", { class: "wrap cab" });
  app.append(w);
  if (!me.user) {
    var failed = location.search.indexOf("login=failed") !== -1;
    w.append(h("div", { class: "formbox narrow" }, h("h1", { text: t("login_h"), style: "font-size:24px" }), h("p", { class: "hint", text: t("login_p") }),
      failed ? h("p", { class: "err", text: t("login_failed") }) : null, loginWidget("/cabinet")));
    return;
  }
  var u = me.user;
  var logout = h("form", { method: "post", action: "/logout" }, h("button", { class: "btn btn-line btn-sm", type: "submit", text: t("logout") }));
  w.append(h("div", { class: "cabhead" },
    h("div", { class: "userline" }, u.photo_url ? h("img", { src: u.photo_url, alt: "" }) : h("div", { class: "ava", text: (u.first_name || "?").charAt(0) }),
      h("div", { class: "who" }, h("h2", { text: personName(u.first_name, u.last_name, "") }), u.username ? h("p", { class: "role", text: "@" + u.username }) : null)),
    logout));
  var tabs = [["learning", t("t_learning")], ["orders", t("t_orders")], ["profile", t("t_profile")]];
  if (me.isAdmin) tabs.push(["admin", t("t_admin")]);
  var bar = h("div", { class: "tabs", role: "tablist" }), body = h("div", { class: "list" });
  tabs.forEach(function (tb) {
    bar.append(h("button", { type: "button", class: "tab", role: "tab", "aria-selected": String(cabTab === tb[0]), text: tb[1],
      onclick: function () { cabTab = tb[0]; render(); } }));
  });
  w.append(bar, body);
  var run = cabTab === "profile" ? tabProfile : cabTab === "admin" && me.isAdmin ? tabAdmin : cabTab === "orders" ? tabOrders : tabLearning;
  body.append(h("p", { class: "hint", text: t("loading") }));
  run(body).catch(function (e) { body.textContent = ""; body.append(h("p", { class: "err", text: e.status === 401 ? t("need_login") : t("error") })); });
}

async function setStatus(id, status) {
  await api("/api/orders/" + id + "/status", { status: status });
  render();
}

function orderCard(o, as, extra) {
  var title;
  if (as === "client") title = o.specialist_name ? o.specialist_name + (o.specialist_title ? " — " + o.specialist_title : "") : t("spec_not_set");
  else title = t("client") + ": " + personName(o.client_first, o.client_last, o.client_username);
  var acts = h("div", { class: "actions" });
  function act(label, status, cls) { acts.append(h("button", { type: "button", class: "btn btn-sm " + (cls || "btn-line"), text: label, onclick: function () { this.disabled = true; setStatus(o.id, status).catch(function () { render(); }); } })); }
  if (as === "client" && (o.status === "new" || o.status === "accepted")) act(t("a_cancel"), "cancelled", "btn-danger");
  if (as === "spec" && o.status === "new") { act(t("a_accept"), "accepted", "btn-primary"); act(t("a_decline"), "declined", "btn-danger"); }
  if (as === "spec" && o.status === "accepted") act(t("a_done"), "done", "btn-primary");
  return h("div", { class: "ocard" },
    h("div", { class: "ohead" }, h("h3", { text: "№" + o.id + " · " + title }), badge("st", o.status)),
    h("p", { class: "otask", text: o.task }),
    h("div", { class: "ometa" },
      o.budget ? h("span", { text: t("budget") + ": " + o.budget }) : null,
      o.deadline ? h("span", { text: t("deadline") + ": " + o.deadline }) : null,
      as !== "client" && o.contact ? h("span", { text: t("contact") + ": " + o.contact }) : null,
      h("span", { text: t("created") + ": " + fmtDate(o.created_at) })),
    extra || null,
    acts.childNodes.length ? acts : null);
}

async function tabOrders(body) {
  var d = await api("/api/orders");
  body.textContent = "";
  body.append(h("h2", { text: t("my_orders") }));
  if (!d.mine.length) body.append(h("p", { class: "empty" }, t("no_my_orders") + " ", h("a", { href: "/#people", text: t("n_people") })));
  d.mine.forEach(function (o) { body.append(orderCard(o, "client")); });
  if (me.profile || d.forme.length) {
    body.append(h("h2", { text: t("forme"), style: "margin-top:12px" }));
    if (!d.forme.length) body.append(h("p", { class: "empty", text: t("no_forme") }));
    d.forme.forEach(function (o) { body.append(orderCard(o, "spec")); });
  }
}

async function tabProfile(body) {
  var p = me.profile || {};
  body.textContent = "";
  var catSel = h("select", { id: "p-cat" });
  CATS.slice(1).forEach(function (c) { catSel.append(h("option", { value: c.id, text: c[lang] })); });
  catSel.value = p.category || "dev";
  var err = h("p", { class: "err", "aria-live": "polite" }), ok = h("p", { class: "ok", hidden: true });
  var btn = h("button", { class: "btn btn-primary", type: "submit", text: t("p_save") });
  var form = h("form", { class: "formbox", novalidate: true },
    me.profile ? h("div", { class: "actions" }, h("span", { class: "hint", text: t("p_status") + ":" }), badge("ps", p.status)) : h("p", { class: "hint", text: t("p_intro") }),
    h("div", { class: "row" },
      h("label", null, t("p_name"), h("input", { id: "p-name", maxlength: "80", value: p.name || [me.user.first_name, me.user.last_name].filter(Boolean).join(" ") })),
      h("label", null, t("p_title"), h("input", { id: "p-title", maxlength: "80", placeholder: t("p_title_ph"), value: p.title || "" }))),
    h("div", { class: "row" },
      h("label", null, t("p_cat"), catSel),
      h("label", null, t("p_city"), h("input", { id: "p-city", maxlength: "60", value: p.city || "" }))),
    h("label", null, t("p_skills"), h("textarea", { id: "p-skills", maxlength: "1500", value: p.skills || "" })),
    h("div", { class: "row" },
      h("label", null, t("p_price"), h("input", { id: "p-price", maxlength: "60", placeholder: "$100", value: p.price || "" })),
      h("label", null, t("p_portfolio"), h("input", { id: "p-portfolio", maxlength: "300", placeholder: "https://", value: p.portfolio || "" }))),
    err, ok, h("div", null, btn));
  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    function val(id) { return form.querySelector(id).value.trim(); }
    if (!val("#p-name") || !val("#p-title") || !val("#p-skills")) { err.textContent = t("p_req"); return; }
    err.textContent = ""; btn.disabled = true;
    try {
      var r = await api("/api/profile", { name: val("#p-name"), title: val("#p-title"), category: catSel.value, skills: val("#p-skills"),
        price: val("#p-price"), city: val("#p-city"), portfolio: val("#p-portfolio") });
      me.profile = r.profile; ok.hidden = false; ok.textContent = t("p_saved");
      var st = form.querySelector(".badge"); if (st) st.replaceWith(badge("ps", r.profile.status));
    } catch (ex) { err.textContent = ex.status === 401 ? t("need_login") : t("error"); }
    finally { btn.disabled = false; }
  });
  body.append(form);
}

async function tabAdmin(body) {
  var d = await api("/api/admin");
  body.textContent = "";
  body.append(h("div", { class: "stats" },
    [["users", d.counts.users], ["specialists", d.counts.specialists], ["orders", d.counts.orders], ["leads", d.counts.leads], ["certs_n", d.counts.certs]].map(function (x) {
      return h("div", null, h("b", { text: x[1] }), h("span", { text: t(x[0]) }));
    })));

  body.append(h("h2", { text: t("adm_leads"), style: "margin-top:8px" }));
  var openLeads = (d.leads || []).filter(function (l) { return l.status !== "archived"; });
  if (!openLeads.length) body.append(h("p", { class: "empty", text: t("adm_noleads") }));
  openLeads.forEach(function (l) {
    function mark(status) { return function () { this.disabled = true; api("/api/admin/leads/" + l.id, { status: status }).then(render, render); }; }
    body.append(h("div", { class: "ocard" },
      h("div", { class: "ohead" }, h("h3", { text: "№" + l.id + " · " + (l.kind === "b2b" ? t("k_b2b") : t("k_learn")) + " · " + l.name + (l.company ? " (" + l.company + ")" : "") }), badge("ls", l.status)),
      h("div", { class: "ometa" },
        h("span", { text: t("contact") + ": " + l.contact }),
        l.track ? h("span", { text: trackName(l.track) }) : null, l.level ? h("span", { text: l.level }) : null,
        l.english ? h("span", { text: "English: " + l.english }) : null, l.city ? h("span", { text: l.city }) : null,
        h("span", { text: t("created") + ": " + fmtDate(l.created_at) })),
      l.message ? h("p", { class: "otask", text: l.message }) : null,
      h("div", { class: "actions" },
        l.status === "new" ? h("button", { type: "button", class: "btn btn-primary btn-sm", text: t("adm_contacted"), onclick: mark("contacted") }) : null,
        h("button", { type: "button", class: "btn btn-line btn-sm", text: t("adm_archive"), onclick: mark("archived") }))));
  });

  body.append(h("h2", { text: t("adm_certs"), style: "margin-top:12px" }));
  if (!(d.certs || []).length) body.append(h("p", { class: "empty", text: "—" }));
  (d.certs || []).forEach(function (c) {
    body.append(h("div", { class: "ocard" },
      h("div", { class: "ohead" }, h("h3", null, h("a", { href: link("/cert/" + c.code), text: c.code }), " · " + c.full_name),
        h("span", { class: "badge " + (c.revoked ? "b-rejected" : "b-accepted"), text: c.revoked ? t("cert_revoked") : (c.kind === "program" ? t("k_id") : t("k_cert")) })),
      h("div", { class: "ometa" }, h("span", { text: c.title }), h("span", { text: c.score + "%" }), c.username ? h("span", { text: "@" + c.username }) : null, h("span", { text: fmtDate(c.issued_at) })),
      h("div", { class: "actions" }, h("button", { type: "button", class: "btn btn-sm " + (c.revoked ? "btn-line" : "btn-danger"), text: c.revoked ? t("adm_restore") : t("adm_revoke"),
        onclick: function () { this.disabled = true; api("/api/admin/certs/" + c.code, { revoked: !c.revoked }).then(render, render); } }))));
  });

  body.append(h("h2", { text: t("adm_pending"), style: "margin-top:12px" }));
  if (!d.pending.length) body.append(h("p", { class: "empty", text: t("adm_none") }));
  d.pending.forEach(function (p) {
    function decide(status) { return function () { this.disabled = true; api("/api/admin/profiles/" + p.user_id, { status: status }).then(render, render); }; }
    body.append(h("div", { class: "ocard" },
      h("div", { class: "ohead" }, h("h3", { text: p.name + " — " + p.title }), badge("ps", p.status)),
      h("p", { class: "otask", text: p.skills }),
      h("div", { class: "ometa" }, h("span", { text: catName(p.category) }), p.city ? h("span", { text: p.city }) : null, p.price ? h("span", { text: p.price }) : null,
        h("span", { text: "Telegram: " + personName(p.first_name, p.last_name, p.username) }),
        p.portfolio ? h("a", { href: p.portfolio, target: "_blank", rel: "noopener nofollow", text: t("portfolio") }) : null),
      h("div", { class: "actions" },
        h("button", { type: "button", class: "btn btn-primary btn-sm", text: t("adm_approve"), onclick: decide("approved") }),
        h("button", { type: "button", class: "btn btn-danger btn-sm", text: t("adm_reject"), onclick: decide("rejected") }))));
  });

  body.append(h("h2", { text: t("adm_orders"), style: "margin-top:12px" }));
  if (!d.orders.length) body.append(h("p", { class: "empty", text: "—" }));
  d.orders.forEach(function (o) {
    var extra = null;
    if (!o.specialist_id || o.status === "declined") {
      var sel = h("select", { style: "max-width:280px" }, h("option", { value: "", text: t("adm_pick") }));
      d.approved.forEach(function (s) { sel.append(h("option", { value: String(s.user_id), text: s.name + " — " + s.title })); });
      extra = h("div", { class: "actions" }, sel, h("button", { type: "button", class: "btn btn-line btn-sm", text: t("adm_assign"),
        onclick: function () { if (!sel.value) return; this.disabled = true; api("/api/admin/orders/" + o.id, { specialist_id: Number(sel.value) }).then(render, render); } }));
    }
    var card = orderCard(o, "admin", extra);
    card.querySelector("h3").textContent = "№" + o.id + " · " + personName(o.client_first, o.client_last, o.client_username) + " → " + (o.specialist_name || t("spec_not_set"));
    body.append(card);
  });
}

boot();
