<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SkillBridge</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="SkillBridge — обучение цифровым профессиям и выход на удалённую работу: диагностика, курсы, наставники, сертификация, заказы.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=PT+Serif:wght@700&display=swap">
<style>
/* Layout: a quiet, mobile-first page that walks the reader along the learning path — tracks, stages, who it's for, specialists, companies, enrolment. */
:root{
  --bg:#f7f8f6; --surface:#ffffff; --ink:#18221d; --muted:#5b6862; --line:#dfe4df;
  --accent:#1f6b4f; --accent-ink:#ffffff; --soft:#e8f1ec; --warn:#a33a2c; --warn-soft:#f8e7e3; --amber:#8a5a00; --amber-soft:#f8efd9;
  --font:"Golos Text","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111714; --surface:#18201c; --ink:#e7ede9; --muted:#9eaba4; --line:#29342e;
  --accent:#62c29a; --accent-ink:#0d1a14; --soft:#1c2d25; --warn:#e8806f; --warn-soft:#35201c; --amber:#e5b75a; --amber-soft:#332a17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111714; --surface:#18201c; --ink:#e7ede9; --muted:#9eaba4; --line:#29342e;
  --accent:#62c29a; --accent-ink:#0d1a14; --soft:#1c2d25; --warn:#e8806f; --warn-soft:#35201c; --amber:#e5b75a; --amber-soft:#332a17; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55}
[hidden]{display:none!important}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:clamp(28px,4.6vw,44px);font-weight:700;letter-spacing:-.01em}
h2{font-size:clamp(20px,2.6vw,26px);font-weight:700}
h3{font-size:16px;font-weight:600}
p{margin:0}
a{color:var(--accent)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;text-decoration:none;color:var(--ink);flex:none}
.logo svg{width:28px;height:16px}
.nav{display:flex;gap:18px;font-size:14px}
.nav a{color:var(--muted);text-decoration:none}
.nav a:hover{color:var(--ink)}
.right{display:flex;gap:8px;align-items:center}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{border:0;background:var(--surface);color:var(--muted);font:600 12px var(--font);padding:6px 10px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:8px;padding:11px 18px;font:600 14px var(--font);cursor:pointer;text-decoration:none}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-line{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn-danger{background:var(--surface);color:var(--warn);border:1px solid var(--line)}
.btn-sm{padding:7px 12px;font-size:13px}
.btn:disabled{opacity:.6;cursor:default}
:is(.btn,.lang button,.chip,input,select,textarea,.tab,a):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.lead{color:var(--muted);font-size:clamp(16px,1.8vw,18px);max-width:62ch}
.hero{padding-block:44px 36px;display:grid;gap:16px}
.ctas{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.path{list-style:none;margin:20px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.path li{padding:14px 16px;display:grid;gap:2px;position:relative;min-width:0}
.path li+li{border-left:1px solid var(--line)}
.path b{font-size:14px}
.path span{font-size:13px;color:var(--muted)}
.path .n{font-size:12px;font-weight:700;color:var(--accent)}
section{padding-block:40px;border-top:1px solid var(--line)}
.sec-head{display:grid;gap:8px;margin-bottom:22px;max-width:66ch}
.sec-head p{color:var(--muted)}
.tracks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.track{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:10px;align-content:start;min-width:0}
.track .skills{font-size:13px;color:var(--muted)}
.hsearch{position:relative;max-width:640px;margin-top:6px}
.hsinput{font-size:16px;padding:14px 16px;border-radius:10px;background:var(--surface)}
.hres{margin-top:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;display:grid;gap:2px;max-height:420px;overflow:auto}
.hlabel{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 8px 2px}
.hitem{display:grid;gap:2px;text-align:left;border:0;background:transparent;color:var(--ink);font:inherit;padding:8px;border-radius:8px;cursor:pointer}
.hitem:hover,.hitem:focus-visible{background:var(--soft)}
.hitem b{font-weight:600;font-size:14px}
.hitem span{font-size:13px;color:var(--muted)}
.hmore{border:0;background:transparent;color:var(--accent);font:600 13px var(--font);padding:8px;text-align:left;cursor:pointer}
.thead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tgroup{font-size:12px;color:var(--muted)}
.track.main{border-color:var(--accent)}
.track.flash{box-shadow:0 0 0 3px var(--accent)}
.more{display:flex;justify-content:center;margin-top:16px}
.more:empty{display:none}
.facts{display:grid;gap:4px;font-size:13px;margin:0}
.facts div{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:6px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--muted);margin-top:12px}
.stages{list-style:none;margin:0;padding:0;display:grid;gap:0}
.stage{display:grid;grid-template-columns:120px minmax(0,1fr) minmax(0,.8fr);gap:16px;padding:16px 0;border-top:1px solid var(--line)}
.stage:last-child{border-bottom:1px solid var(--line)}
.stage .when{font-size:13px;color:var(--muted)}
.stage .when b{display:block;color:var(--ink);font-size:15px}
.stage p{color:var(--muted);font-size:14px}
.stage .out{font-size:14px;font-weight:600;color:var(--accent)}
.stage .out small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.audience{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.aud{border-left:2px solid var(--accent);padding:4px 0 4px 14px;display:grid;gap:4px}
.aud p{font-size:14px;color:var(--muted)}
.features{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 24px;margin-top:28px}
.feature{display:grid;gap:4px}
.feature p{font-size:14px;color:var(--muted)}
.tools{display:grid;gap:12px;padding-bottom:16px}
.search{max-width:520px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 13px var(--font);padding:6px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--soft);border-color:var(--accent);color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;padding-bottom:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:10px;align-content:start;min-width:0}
.card .top{display:flex;gap:12px;align-items:center}
.ava{width:40px;height:40px;border-radius:50%;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:none}
.who{min-width:0}
.role{color:var(--muted);font-size:13px}
.skills{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.price{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.sample{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.empty{padding:20px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);text-align:center}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:32px;align-items:start}
.points{margin:0;padding:0;list-style:none;display:grid;gap:14px}
.points li{display:grid;gap:2px}
.points p{color:var(--muted);font-size:14px}
.formbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:14px;min-width:0}
.narrow{max-width:480px;margin-inline:auto}
form{display:grid;gap:12px}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
label{display:grid;gap:4px;font-size:13px;font-weight:500}
input,select,textarea{width:100%;font:400 14px var(--font);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
textarea{min-height:90px;resize:vertical}
.hint{font-size:13px;color:var(--muted)}
.err{font-size:13px;color:var(--warn)}
.ok{border:1px solid var(--accent);background:var(--soft);border-radius:8px;padding:12px;font-size:14px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.tgw{min-height:44px}
.auth{display:grid;gap:12px}
.or{font-size:13px;color:var(--muted);text-align:center;border-top:1px solid var(--line);padding-top:12px}
.demo{font-size:13px;color:var(--amber);background:var(--amber-soft);border-radius:8px;padding:10px 12px}
.cab{padding-block:28px;display:grid;gap:18px}
.cabhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.userline{display:flex;align-items:center;gap:12px;min-width:0}
.userline img{width:44px;height:44px;border-radius:50%}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px}
.tab{border:1px solid var(--line);background:transparent;color:var(--ink);font:600 13px var(--font);padding:8px 14px;border-radius:8px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.list{display:grid;gap:10px}
.ocard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:8px;min-width:0}
.ohead{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.otask{white-space:pre-wrap;overflow-wrap:anywhere}
.ometa{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.badge{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.b-new,.b-pending{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.b-accepted,.b-approved,.b-contacted{background:var(--soft);color:var(--accent);border-color:transparent}
.b-done{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.b-declined,.b-cancelled,.b-rejected{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.stats{display:flex;gap:24px;flex-wrap:wrap}
.stats b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stats span{font-size:13px;color:var(--muted)}
footer{padding-block:24px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

.crs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.crs .track h3 a{color:inherit;text-decoration:none}
.crs .track h3 a:hover{text-decoration:underline}
.cmeta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted)}
.bar2{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar2 i{display:block;height:100%;background:var(--accent);border-radius:99px}
.prog{border:1px dashed var(--accent);border-radius:12px;padding:18px;display:grid;gap:8px;margin-top:12px;background:var(--surface)}
.page{padding-block:28px 40px;display:grid;gap:18px}
.crumbs{font-size:13px;color:var(--muted)}
.crumbs a{color:var(--muted)}
.outline{list-style:none;margin:0;padding:0;display:grid;gap:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.outline li+li{border-top:1px solid var(--line)}
.outline a,.outline span.row1{display:flex;gap:12px;align-items:center;padding:12px 14px;color:var(--ink);text-decoration:none}
.outline a:hover{background:var(--soft)}
.outline a[aria-current="page"]{background:var(--soft);font-weight:600}
.mark{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;border:1.5px solid var(--line);color:var(--muted);flex:none}
.mark.ok{background:var(--accent);border-color:var(--accent);color:transparent;font-size:0;position:relative}
.mark.ok::after{content:"";position:absolute;left:6px;top:6px;width:8px;height:4px;border-left:2px solid var(--accent-ink);border-bottom:2px solid var(--accent-ink);transform:rotate(-45deg)}
.learn{display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px;align-items:start}
.learn aside{position:sticky;top:72px}
.lesson{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;display:grid;gap:14px;min-width:0}
.md{display:grid;gap:12px;font-size:16px;line-height:1.65;max-width:72ch}
.md h3{font-size:18px;margin-top:6px}
.md ul,.md ol{margin:0;padding-left:22px;display:grid;gap:4px}
.md code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.9em;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.md pre{margin:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow-x:auto}
.md pre code{border:0;padding:0;background:none;font-size:13px;line-height:1.5}
.quiz{display:grid;gap:16px;border-top:1px solid var(--line);padding-top:18px}
.qitem{display:grid;gap:8px;border:0;margin:0;padding:0;min-width:0}
.qitem legend{font-weight:600;padding:0;margin-bottom:6px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-weight:400;font-size:15px}
.opt input{width:auto;margin-top:3px}
.opt:has(input:checked){border-color:var(--accent);background:var(--soft)}
.qitem.right .opt:has(input:checked){border-color:var(--accent)}
.qitem.wrong .opt:has(input:checked){border-color:var(--warn);background:var(--warn-soft)}
.qres{font-size:13px;font-weight:600}
.qitem.right .qres{color:var(--accent)} .qitem.wrong .qres{color:var(--warn)}
.navrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.certwrap{display:grid;gap:14px;justify-items:center}
.certdoc{container-type:inline-size;width:100%;max-width:960px;aspect-ratio:297/210;background:#fff;color:#18221d;border-radius:6px;box-shadow:0 1px 0 #dfe4df,0 10px 40px rgba(0,0,0,.08);position:relative;overflow:hidden}
.certdoc .frame{position:absolute;inset:3cqi;border:.25cqi solid #1f6b4f;outline:.12cqi solid #1f6b4f;outline-offset:-.9cqi;display:grid;grid-template-rows:auto 1fr auto;padding:4cqi 6cqi 3.4cqi}
.certdoc .ctop{display:flex;justify-content:space-between;align-items:center;font-size:1.6cqi;color:#5b6862}
.certdoc .ctop b{display:flex;align-items:center;gap:1cqi;font-size:2.2cqi;color:#18221d}
.certdoc .ctop svg{width:3.6cqi;height:2cqi}
.certdoc .cmid{display:grid;align-content:center;justify-items:center;text-align:center;gap:1.4cqi}
.certdoc .ckind{font-size:5.2cqi;font-weight:700;letter-spacing:.18em;color:#1f6b4f}
.certdoc .cno{font-size:1.6cqi;color:#5b6862;letter-spacing:.06em}
.certdoc .ctext{font-size:1.9cqi;color:#5b6862}
.certdoc .cname{font-size:4.4cqi;font-weight:700;line-height:1.15;border-bottom:.15cqi solid #dfe4df;padding:0 4cqi .8cqi}
.certdoc .ctitle{font-size:2.8cqi;font-weight:600;max-width:80%}
.certdoc .cfacts{display:flex;gap:4cqi;font-size:1.7cqi;color:#5b6862}
.certdoc .cfacts b{display:block;color:#18221d;font-size:2.1cqi}
.certdoc .cbot{display:flex;justify-content:space-between;align-items:flex-end;gap:3cqi;font-size:1.35cqi;color:#5b6862}
.certdoc .signbox{display:grid;justify-items:center;width:32cqi}
.certdoc .sigimg{width:27cqi;height:auto;margin:0 0 -.7cqi 3cqi;position:relative;z-index:1}
.certdoc .sigline{width:100%;border-top:.14cqi solid #8a6d2b}
.certdoc .signname{font-family:"PT Serif",Georgia,serif;font-size:2.3cqi;font-weight:700;color:#18221d;margin-top:.9cqi}
.certdoc .sign{font-family:"PT Serif",Georgia,serif;font-size:1.5cqi;color:#5b6862;margin-top:.2cqi}
.certdoc .cnote{max-width:46cqi}
.revoked{position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,255,255,.72);font-size:6cqi;font-weight:700;color:#a33a2c;letter-spacing:.1em;transform:rotate(-8deg)}
.verify{display:flex;gap:8px;flex-wrap:wrap;max-width:520px}
.verify input{flex:1;min-width:200px;text-transform:uppercase}
@media (max-width:900px){.crs{grid-template-columns:repeat(2,minmax(0,1fr))}.learn{grid-template-columns:1fr}.learn aside{position:static}}
@media (max-width:640px){.crs{grid-template-columns:1fr}.lesson{padding:16px}}
@media print{
  @page{size:A4 landscape;margin:0}
  header,footer,.noprint{display:none!important}
  body{background:#fff}
  .page{padding:0}
  .certdoc{max-width:none;width:297mm;height:210mm;aspect-ratio:auto;box-shadow:none;border-radius:0}
}
@media (max-width:900px){.nav{display:none}.tracks,.features{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}}
@media (max-width:640px){
  .row,.tracks,.features{grid-template-columns:1fr}
  .path{grid-template-columns:repeat(2,minmax(0,1fr))}
  .path li:nth-child(3){border-left:0}
  .path li:nth-child(n+3){border-top:1px solid var(--line)}
  .stage{grid-template-columns:1fr;gap:6px}
}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}

<script>var DEMO_COURSES = [{"slug": "freelance", "lessons": [{"title": "Как устроен фриланс", "body": "Фриланс — это работа на заказ без постоянного трудоустройства: клиент платит за результат или за время, а вы сами выбираете проекты.\n\n### Три модели оплаты\n* **Проектная** — фиксированная цена за результат: логотип, лендинг, перевод документа.\n* **Почасовая** — оплата за отработанные часы. Подходит для задач, объём которых сложно оценить заранее.\n* **Ретейнер** — ежемесячная оплата за постоянный объём работы: ведение соцсетей, поддержка сайта.\n\n### Где искать заказы\n* Международные площадки: Upwork, Fiverr, Freelancer — оплата в долларах, нужен английский.\n* Русскоязычные: Kwork, FL.ru, Freelance.ru.\n* Каналы и чаты с вакансиями в мессенджерах, LinkedIn, знакомые и бывшие работодатели.\n\n### Чего ждёт клиент\nКлиенту важно не ваше резюме, а уверенность, что задача будет сделана в срок и так, как нужно. Поэтому на старте решают три вещи: понятное описание услуги, примеры работ и быстрый вежливый ответ.", "quiz": [{"q": "Как называется модель, когда клиент платит фиксированную сумму каждый месяц за постоянный объём работы?", "options": ["Проектная оплата", "Почасовая оплата", "Ретейнер"], "correct": 2}, {"q": "Что важнее всего клиенту, когда он выбирает исполнителя без отзывов?", "options": ["Диплом престижного вуза", "Понятная услуга, примеры работ и быстрый ответ", "Самая низкая цена на площадке"], "correct": 1}]}, {"title": "Выбор ниши и упаковка услуги", "body": "Новичку проще продавать одну понятную услугу, чем «всё понемногу». «Делаю дизайн» — размыто. «Делаю обложки для Reels для кафе и салонов красоты» — понятно и запоминается.\n\n### Формула услуги\n**Что делаю + для кого + какой результат получит клиент.**\n\nПример: «Настрою таргетированную рекламу в Instagram для местного бизнеса, чтобы получать заявки в директ».\n\n### Как выбрать нишу\n1. Выпишите навыки, которые у вас уже есть или которые вы осваиваете.\n2. Посмотрите на площадках, какие заказы по ним публикуют чаще всего.\n3. Выберите 1–2 услуги, где спрос есть, а вход для новичка реален.\n\n### Цена на старте\nНачните с нижней части рыночного диапазона, но не демпингуйте. После 3–5 хороших отзывов повышайте цену. Слишком низкая цена отпугивает часть клиентов: она выглядит как признак низкого качества.", "quiz": [{"q": "Какая формулировка услуги лучше подходит для профиля новичка?", "options": ["«Делаю всё, что связано с компьютером»", "«Дизайн, SMM, сайты, переводы, тексты»", "«Делаю карточки товаров для Wildberries, которые повышают кликабельность»"], "correct": 2}, {"q": "Когда обычно стоит повышать цену?", "options": ["Сразу после регистрации на площадке", "После нескольких хороших отзывов и выполненных заказов", "Никогда: низкая цена — главное преимущество"], "correct": 1}]}, {"title": "Портфолио без опыта", "body": "Без примеров работ клиенту трудно вам поверить. Хорошая новость: первые работы можно сделать самостоятельно.\n\n### Откуда взять первые работы\n* **Учебные проекты** — задания из курсов, доведённые до аккуратного вида.\n* **Редизайн** — улучшите сайт, баннер или текст реальной компании и покажите «было — стало».\n* **Работа для знакомых** — бесплатно или недорого, но в обмен на отзыв.\n\n### Как оформить кейс\nКаждая работа в портфолио — это короткая история:\n1. **Задача** — что нужно было сделать и для кого.\n2. **Решение** — что вы сделали и почему.\n3. **Результат** — что получилось: цифры, отзыв, скриншоты.\n\n### Где хранить\nBehance или Dribbble — для дизайнеров, GitHub — для разработчиков, облачный диск или Notion — для всех остальных. Главное, чтобы ссылка открывалась без регистрации.", "quiz": [{"q": "Из каких частей состоит хорошо оформленный кейс?", "options": ["Задача, решение, результат", "Название, цена, дата", "Только финальная картинка без описания"], "correct": 0}, {"q": "Что делать, если у вас ещё нет реальных заказов?", "options": ["Ждать первого заказа, а потом делать портфолио", "Сделать учебные проекты и редизайны и оформить их как кейсы", "Взять чужие работы из интернета"], "correct": 1}]}, {"title": "Профиль и отклик клиенту", "body": "### Профиль\n* **Фото** — ваше лицо, нейтральный фон, хорошее освещение.\n* **Заголовок** — ваша услуга, а не должность: «UX/UI-дизайнер мобильных приложений».\n* **Описание** — для кого вы работаете, какие задачи решаете, как проходит работа.\n\n### Отклик, на который отвечают\nКлиент получает десятки откликов. Шаблонное «Здравствуйте, готов выполнить ваш заказ» он пропускает. Хороший отклик короткий и показывает, что вы прочитали задачу:\n1. Обращение и одна фраза о том, как вы поняли задачу.\n2. Как будете решать — 2–3 шага.\n3. Ссылка на похожую работу.\n4. Уточняющий вопрос.\n5. Срок и цена.\n\n**Пример:** «Здравствуйте, Анна! Вам нужен лендинг для курсов английского с формой записи. Сделаю макет в Figma, сверстаю на Tilda и подключу приём заявок на почту. Похожая работа: (ссылка). Есть ли у вас фирменные цвета и логотип? Срок — 5 дней, стоимость — 150 $».", "quiz": [{"q": "Что лучше написать в заголовке профиля?", "options": ["«Ищу работу»", "Конкретную услугу, например «Настройка таргетированной рекламы для малого бизнеса»", "Только имя и город"], "correct": 1}, {"q": "Зачем в отклике задавать уточняющий вопрос?", "options": ["Он показывает, что вы вникли в задачу, и начинает диалог", "Чтобы потянуть время", "Вопросы в отклике лучше не задавать"], "correct": 0}]}, {"title": "Работа с заказом и безопасность", "body": "### Перед стартом\n* Уточните задачу письменно: что нужно сделать, в каком виде сдать, срок, сколько правок входит в цену.\n* Договоритесь об оплате: предоплата, оплата по этапам или безопасная сделка площадки.\n\n### Во время работы\nСообщайте о прогрессе без напоминаний клиента. Если что-то пошло не по плану — пишите сразу и предлагайте решение.\n\n### Сдача и отзыв\nСдавайте работу в оговорённом виде, коротко поясните, что сделано. После приёмки вежливо попросите отзыв — на старте это ваш главный капитал.\n\n### Признаки мошенничества\n* Просят заплатить за «тестовое задание», «доступ к заказам» или «обучение».\n* Уговаривают уйти с площадки до оплаты.\n* Присылают ссылки на «оплату», где нужно ввести данные карты.\n* Обещают оплату намного выше рынка за простую работу.", "quiz": [{"q": "Какой способ оплаты защищает исполнителя лучше всего?", "options": ["Полная оплата после сдачи, без договорённостей", "Предоплата, оплата по этапам или безопасная сделка площадки", "Оплата «как получится»"], "correct": 1}, {"q": "Заказчик просит вас перевести 20 $ за «доступ к проекту». Что это?", "options": ["Обычная практика", "Признак мошенничества", "Предоплата исполнителя"], "correct": 1}]}], "exam": [{"q": "Какая модель оплаты подходит для ежемесячного ведения соцсетей?", "options": ["Проектная", "Ретейнер", "Разовая"], "correct": 1}, {"q": "Какая формулировка услуги сильнее?", "options": ["«Дизайнер, сделаю всё»", "«Создаю обложки для YouTube, которые повышают кликабельность»", "«Работаю за любые деньги»"], "correct": 1}, {"q": "Что лучше всего заменяет отзывы на старте?", "options": ["Скидка 90%", "Портфолио из учебных проектов и редизайнов", "Длинное резюме"], "correct": 1}, {"q": "Как начать хороший отклик?", "options": ["«Здравствуйте, готов выполнить заказ»", "С обращения и одной фразы о том, как вы поняли задачу", "С рассказа о своём образовании"], "correct": 1}, {"q": "Что нужно согласовать письменно до начала работы?", "options": ["Задачу, формат сдачи, срок, число правок и порядок оплаты", "Только цену", "Ничего: так быстрее"], "correct": 0}, {"q": "Клиент предлагает продолжить общение в мессенджере и оплатить «потом». Как поступить?", "options": ["Согласиться сразу", "Оставаться на площадке или договориться о предоплате и безопасной сделке", "Попросить оплату криптовалютой без договора"], "correct": 1}, {"q": "Когда разумно повышать цену?", "options": ["После нескольких выполненных заказов с хорошими отзывами", "На следующий день после регистрации", "Цену нельзя менять"], "correct": 0}, {"q": "Что делать, если вы не успеваете к сроку?", "options": ["Молчать до последнего", "Сразу сообщить клиенту и предложить решение", "Сдать недоделанную работу без объяснений"], "correct": 1}], "title": "Старт на фрилансе: от профиля до первого заказа", "title_en": "Freelance start: from profile to first order", "level": "Начальный", "hours": 4, "summary": "Как выбрать услугу, собрать портфолио без опыта, написать отклик и безопасно провести первый заказ.", "about": "Курс для тех, кто хочет зарабатывать удалённо, но не знает, с чего начать. Вы разберётесь, как устроены фриланс-площадки, упакуете свою услугу, соберёте первые работы в портфолио и научитесь писать отклики, на которые отвечают клиенты."}, {"slug": "excel", "lessons": [{"title": "Интерфейс и данные", "body": "Таблица состоит из **ячеек**. У каждой ячейки есть адрес: буква столбца и номер строки — например, `B3`.\n\n### Типы данных\n* **Числа** — с ними можно считать. Выравниваются по правому краю.\n* **Текст** — выравнивается по левому краю. Если число «прижалось» влево, скорее всего, оно сохранено как текст и не будет считаться.\n* **Даты** — внутри хранятся как числа, поэтому их можно вычитать и сравнивать.\n\n### Полезные приёмы\n* **Автозаполнение** — потяните за правый нижний угол ячейки, чтобы продолжить ряд: 1, 2, 3… или январь, февраль…\n* **Закрепление строки** — «Вид → Закрепить», чтобы заголовки оставались на экране при прокрутке.\n* **Формат ячеек** — денежный, процентный, дата. Формат меняет вид числа, но не само значение.\n\n### Важно про язык\nВ русском Excel функции пишутся по-русски (`СУММ`), а аргументы разделяются точкой с запятой. В англоязычных версиях и онлайн-таблицах работают английские названия (`SUM`). В курсе мы приводим оба варианта.", "quiz": [{"q": "Что обозначает адрес ячейки C5?", "options": ["Столбец C, строка 5", "Строка C, столбец 5", "Пятый лист таблицы"], "correct": 0}, {"q": "Число в ячейке прижато к левому краю и не участвует в сумме. Почему?", "options": ["Ячейка слишком узкая", "Число сохранено как текст", "В таблице слишком много строк"], "correct": 1}]}, {"title": "Формулы и ссылки", "body": "Любая формула начинается со знака `=`. Например, `=B2*C2` перемножает значения двух ячеек.\n\n### Базовые функции\n* `=СУММ(B2:B10)` / `=SUM(B2:B10)` — сумма диапазона.\n* `=СРЗНАЧ(B2:B10)` / `=AVERAGE(B2:B10)` — среднее.\n* `=МАКС()` и `=МИН()` / `=MAX()` и `=MIN()` — наибольшее и наименьшее.\n* `=ОКРУГЛ(B2;2)` / `=ROUND(B2,2)` — округление до двух знаков.\n\n### Относительные и абсолютные ссылки\nКогда вы копируете формулу вниз, ссылки **сдвигаются**: `=B2*C2` превращается в `=B3*C3`. Это относительные ссылки.\n\nЕсли ссылка должна оставаться на месте — например, на ячейку с курсом валюты, — закрепите её знаком доллара: `=B2*$F$1`. Это абсолютная ссылка. Быстро поставить знаки `$` можно клавишей **F4**.", "quiz": [{"q": "Формулу `=B2*$F$1` скопировали на строку ниже. Что получится?", "options": ["`=B3*$F$2`", "`=B3*$F$1`", "`=B2*$F$1`"], "correct": 1}, {"q": "С какого символа начинается любая формула?", "options": ["С двоеточия", "Со знака равенства", "С кавычки"], "correct": 1}]}, {"title": "Логика и поиск данных", "body": "### ЕСЛИ\n`=ЕСЛИ(B2>=100;\"Да\";\"Нет\")` / `=IF(B2>=100,\"Да\",\"Нет\")` — проверяет условие и возвращает одно из двух значений.\n\n### Подсчёт по условию\n* `=СЧЁТЕСЛИ(C2:C100;\"Душанбе\")` / `=COUNTIF(...)` — сколько раз встречается значение.\n* `=СУММЕСЛИ(C2:C100;\"Душанбе\";D2:D100)` / `=SUMIF(...)` — сумма по условию.\n\n### ВПР — поиск значения в другой таблице\n`=ВПР(A2;Прайс!A:B;2;ЛОЖЬ)` / `=VLOOKUP(A2,Прайс!A:B,2,FALSE)` ищет значение из `A2` в первом столбце диапазона и возвращает значение из второго столбца.\n\nПоследний аргумент `ЛОЖЬ` (или `0`) означает **точное совпадение** — почти всегда нужен именно он. В новых версиях есть удобная замена — `ПРОСМОТРX` / `XLOOKUP`.", "quiz": [{"q": "Что вернёт `=ЕСЛИ(5>3;\"А\";\"Б\")`?", "options": ["А", "Б", "Ошибку"], "correct": 0}, {"q": "Зачем в ВПР указывают последний аргумент ЛОЖЬ (0)?", "options": ["Чтобы искать приблизительно", "Чтобы искать точное совпадение", "Чтобы скрыть ошибки"], "correct": 1}]}, {"title": "Сортировка, фильтры и оформление", "body": "### Сортировка и фильтр\nВыделите таблицу с заголовками и включите фильтр («Данные → Фильтр»). В заголовках появятся стрелки: по ним можно сортировать и скрывать лишние строки. Фильтр не удаляет данные — он только временно их прячет.\n\n### Условное форматирование\nПравила, которые сами раскрашивают ячейки: например, просроченные даты — красным, суммы больше 1000 — зелёным. Удобно, чтобы сразу видеть важное.\n\n### Проверка данных\n«Данные → Проверка данных» позволяет ограничить ввод: только числа, только даты или выбор из выпадающего списка. Так меньше ошибок, когда таблицу заполняют несколько человек.", "quiz": [{"q": "Что делает фильтр со строками, которые не подходят под условие?", "options": ["Удаляет их навсегда", "Временно скрывает", "Перемещает на другой лист"], "correct": 1}, {"q": "Как сделать, чтобы в ячейке можно было выбрать значение только из списка?", "options": ["Условное форматирование", "Проверка данных с выпадающим списком", "Закрепление строки"], "correct": 1}]}, {"title": "Сводные таблицы и диаграммы", "body": "### Сводная таблица\nПозволяет за минуту получить итог по большим данным: например, сумму продаж по каждому городу и месяцу. «Вставка → Сводная таблица», затем перетащите поля:\n* в **Строки** — то, по чему группируем (город);\n* в **Столбцы** — второй разрез (месяц);\n* в **Значения** — что считаем (сумма продаж).\n\n### Какую диаграмму выбрать\n* **Линейчатая или столбчатая** — сравнить значения между категориями.\n* **График (линия)** — показать изменение во времени.\n* **Круговая** — доли целого, если категорий немного (до 5–6).\n\nДайте диаграмме понятное название и подпишите оси — так отчёт поймут без пояснений.", "quiz": [{"q": "Куда в сводной таблице перетаскивают поле, по которому нужно посчитать сумму?", "options": ["В «Фильтры»", "В «Строки»", "В «Значения»"], "correct": 2}, {"q": "Какая диаграмма лучше показывает изменение продаж по месяцам?", "options": ["График (линия)", "Круговая", "Таблица без диаграммы"], "correct": 0}]}], "exam": [{"q": "Как называется ссылка `$A$1`?", "options": ["Относительная", "Абсолютная", "Текстовая"], "correct": 1}, {"q": "Какая функция считает среднее значение?", "options": ["`СУММ` / `SUM`", "`СРЗНАЧ` / `AVERAGE`", "`СЧЁТ` / `COUNT`"], "correct": 1}, {"q": "Какая клавиша быстро добавляет знаки `$` в ссылку?", "options": ["F2", "F4", "F9"], "correct": 1}, {"q": "Как посчитать, сколько раз в столбце встречается «Худжанд»?", "options": ["`СЧЁТЕСЛИ` / `COUNTIF`", "`СУММ` / `SUM`", "`ОКРУГЛ` / `ROUND`"], "correct": 0}, {"q": "Что делает `ВПР` / `VLOOKUP`?", "options": ["Сортирует таблицу", "Находит значение в первом столбце диапазона и возвращает значение из нужного столбца", "Строит диаграмму"], "correct": 1}, {"q": "Что нужно, чтобы просроченные даты автоматически выделялись красным?", "options": ["Фильтр", "Условное форматирование", "Сводная таблица"], "correct": 1}, {"q": "Какой инструмент быстрее всего покажет сумму продаж по каждому городу?", "options": ["Сводная таблица", "Закрепление строки", "Проверка данных"], "correct": 0}, {"q": "Какая диаграмма подходит, чтобы показать доли 3–4 категорий в целом?", "options": ["График", "Круговая", "Точечная"], "correct": 1}], "title": "Excel и онлайн-таблицы для работы", "title_en": "Excel and online spreadsheets for work", "track": "excel", "level": "Начальный", "hours": 6, "summary": "Формулы, ссылки, ЕСЛИ и ВПР, фильтры, условное форматирование, сводные таблицы и диаграммы.", "about": "Таблицы нужны почти в любой удалённой работе: отчёты, учёт заказов, аналитика, ввод данных. За курс вы научитесь уверенно работать с формулами, находить данные в больших таблицах и строить сводные отчёты. Примеры подходят и для Excel, и для онлайн-таблиц."}, {"slug": "html", "lessons": [{"title": "Как устроен веб", "body": "Когда вы открываете сайт, браузер запрашивает у **сервера** файлы и показывает их на экране.\n\n### Три языка веб-страницы\n* **HTML** — содержание и структура: заголовки, текст, ссылки, картинки.\n* **CSS** — внешний вид: цвета, шрифты, отступы, расположение.\n* **JavaScript** — поведение: реакция на клики, загрузка данных.\n\n### Рабочее место\n1. Установите редактор **VS Code**.\n2. Создайте папку проекта и файл `index.html`.\n3. Откройте файл в браузере двойным щелчком — и вы увидите свою страницу.", "quiz": [{"q": "Какой язык отвечает за внешний вид страницы: цвета, шрифты, отступы?", "options": ["HTML", "CSS", "JavaScript"], "correct": 1}, {"q": "Как обычно называют главный файл сайта?", "options": ["index.html", "main.css", "site.exe"], "correct": 0}]}, {"title": "Структура HTML-документа", "body": "HTML состоит из **тегов**. Большинство тегов парные: `<p>текст<\/p>`.\n\n### Каркас страницы\n```\n<!doctype html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <title>Моя страница<\/title>\n<\/head>\n<body>\n  <h1>Привет!<\/h1>\n  <p>Это моя первая страница.<\/p>\n<\/body>\n<\/html>\n```\nВ `head` — служебная информация, в `body` — всё, что видно на экране.\n\n### Основные теги\n* `<h1>`–`<h6>` — заголовки разных уровней. `h1` на странице обычно один.\n* `<p>` — абзац текста.\n* `<a href=\"https://...\">` — ссылка.\n* `<img src=\"photo.jpg\" alt=\"описание\">` — картинка. Атрибут `alt` описывает изображение для поисковиков и незрячих людей.\n* `<ul>` и `<ol>` со вложенными `<li>` — маркированный и нумерованный списки.", "quiz": [{"q": "В какой части документа находится содержимое, которое видит пользователь?", "options": ["В `<head>`", "В `<body>`", "В `<title>`"], "correct": 1}, {"q": "Для чего у тега `<img>` нужен атрибут `alt`?", "options": ["Задаёт размер картинки", "Описывает изображение текстом", "Делает картинку ссылкой"], "correct": 1}]}, {"title": "Семантика и формы", "body": "### Семантические теги\nВместо одних `<div>` используйте теги, которые описывают смысл блока:\n* `<header>` — шапка, `<nav>` — меню, `<main>` — основное содержимое;\n* `<section>` — смысловой раздел, `<footer>` — подвал.\n\nСемантика помогает поисковикам и экранным дикторам понимать страницу.\n\n### Формы\n```\n<form>\n  <label for=\"email\">E-mail<\/label>\n  <input id=\"email\" type=\"email\" required>\n  <button type=\"submit\">Отправить<\/button>\n<\/form>\n```\n* `<label for=\"...\">` связывается с полем по `id` — по клику на подпись курсор встаёт в поле.\n* Тип поля (`email`, `tel`, `number`, `date`) подсказывает телефону, какую клавиатуру показать.\n* `required` не даст отправить форму с пустым полем.", "quiz": [{"q": "Какой тег подходит для главного меню сайта?", "options": ["`<footer>`", "`<nav>`", "`<p>`"], "correct": 1}, {"q": "Как связать подпись `<label>` с полем ввода?", "options": ["Указать в `for` тот же текст, что в `id` поля", "Написать подпись внутри `<title>`", "Никак, они связываются сами"], "correct": 0}]}, {"title": "Основы CSS", "body": "Стили подключают отдельным файлом: `<link rel=\"stylesheet\" href=\"style.css\">` в `head`.\n\n### Селекторы\n* `p { }` — все абзацы;\n* `.card { }` — все элементы с классом `card`;\n* `#logo { }` — элемент с `id=\"logo\"`.\n\n### Блочная модель\nКаждый элемент — это прямоугольник:\n* **content** — содержимое;\n* **padding** — внутренний отступ (между содержимым и рамкой);\n* **border** — рамка;\n* **margin** — внешний отступ (до соседних элементов).\n\nДобавьте в начало стилей `* { box-sizing: border-box; }` — тогда `width` будет включать отступы и рамку, и считать размеры станет проще.", "quiz": [{"q": "Какой селектор выберет все элементы с классом `button`?", "options": ["`#button`", "`.button`", "`button()`"], "correct": 1}, {"q": "Как называется внутренний отступ между содержимым и рамкой?", "options": ["padding", "margin", "border"], "correct": 0}]}, {"title": "Раскладка, адаптивность и публикация", "body": "### Flexbox\n```\n.row {\n  display: flex;\n  gap: 16px;\n  justify-content: space-between;\n  align-items: center;\n}\n```\n`display: flex` выстраивает дочерние элементы в ряд, `gap` задаёт расстояние между ними, `justify-content` — выравнивание по горизонтали, `align-items` — по вертикали.\n\n### Адаптивность\nДобавьте в `head` строку `<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">` — без неё телефон покажет уменьшенную «десктопную» версию.\n\nМедиазапросы меняют стили на узких экранах:\n```\n@media (max-width: 600px) {\n  .row { flex-direction: column; }\n}\n```\n\n### Публикация\nБесплатно опубликовать страницу можно на **GitHub Pages** или **Netlify**: загрузите папку проекта — и получите ссылку, которую можно отправить клиенту или добавить в портфолио.", "quiz": [{"q": "Какое свойство задаёт расстояние между элементами во flex-контейнере?", "options": ["padding", "gap", "border"], "correct": 1}, {"q": "Что произойдёт без `<meta name=\"viewport\">` на телефоне?", "options": ["Страница отобразится уменьшенной, как на компьютере", "Страница не откроется", "Пропадут картинки"], "correct": 0}]}], "exam": [{"q": "Что описывает HTML?", "options": ["Структуру и содержание страницы", "Только цвета и шрифты", "Работу сервера"], "correct": 0}, {"q": "Какой тег создаёт ссылку?", "options": ["`<link>`", "`<a>`", "`<href>`"], "correct": 1}, {"q": "Какой тег подходит для подвала страницы?", "options": ["`<header>`", "`<main>`", "`<footer>`"], "correct": 2}, {"q": "Как выбрать элемент с `id=\"menu\"` в CSS?", "options": ["`#menu`", "`.menu`", "`menu`"], "correct": 0}, {"q": "Чем margin отличается от padding?", "options": ["Ничем", "margin — внешний отступ, padding — внутренний", "margin — цвет рамки, padding — её толщина"], "correct": 1}, {"q": "Что делает `box-sizing: border-box`?", "options": ["Включает padding и border в заданную ширину элемента", "Добавляет рамку всем элементам", "Скрывает переполнение"], "correct": 0}, {"q": "Какое свойство выстраивает дочерние элементы в ряд?", "options": [" function hit(hay, q) {
  var hw = hay.split(/[^0-9a-zа-яґәөүұқғҳҷӣӯ#+]+/i).filter(Boolean);
  var words = norm(q).split(/[^0-9a-zа-яґәөүұқғҳҷӣӯ#+]+/i).filter(Boolean);
  return words.length > 0 && words.every(function (w) {
    return hw.some(function (x) {
      if (x.indexOf(w) === 0) return true;
      return w.length >= 5 && x.length >= 4 && w.indexOf(x.slice(0, Math.max(4, x.length - 2))) === 0;
    });
  });
}

function loginWidget(next) {

  var formBox = h("div");

      tabs.append(h("button", { type: "button", class: "tab", role: "tab", "aria-selected": String(mode === x[0]), text: x[1],
        onclick: function () { mode = x[0]; drawTabs(); drawForm(); } }));
    });
  }
  function drawForm() {
    formBox.textContent = "";
    var reg = mode === "register";
    var err = h("p", { class: "err", "aria-live": "polite" });
    var name = h("input", { id: "a-name", maxlength: "80", autocomplete: "name" });
    var login = h("input", { id: "a-login", maxlength: "32", autocomplete: "username", autocapitalize: "none", spellcheck: "false" });
    var pass = h("input", { id: "a-pass", type: "password", maxlength: "200", autocomplete: reg ? "new-password" : "current-password" });
    var pass2 = h("input", { id: "a-pass2", type: "password", maxlength: "200", autocomplete: "new-password" });
    var btn = h("button", { class: "btn btn-primary", type: "submit", text: reg ? t("a_signup_btn") : t("a_signin_btn") });
    var f = h("form", { novalidate: true, style: "display:grid;gap:10px" },
      reg ? h("label", null, t("a_name"), name) : null,
      h("label", null, t("a_login"), login, reg ? h("span", { class: "hint", text: t("a_login_hint") }) : null),
      h("label", null, t("a_pass"), pass, reg ? h("span", { class: "hint", text: t("a_pass_hint") }) : null),
      reg ? h("label", null, t("a_pass2"), pass2) : null,
      err, h("div", null, btn));
    f.addEventListener("submit", async function (e) {
      e.preventDefault();
      var lv = login.value.trim().toLowerCase(), pv = pass.value;
      if (reg) {
        if (name.value.trim().length < 2) { err.textContent = t("a_err_name"); return; }
        if (!/^[a-z0-9_.-]{3,32}$/.test(lv)) { err.textContent = t("a_err_login"); return; }
        if (pv.length < 8) { err.textContent = t("a_err_pass"); return; }
        if (pv !== pass2.value) { err.textContent = t("a_err_pass2"); return; }
      } else if (!lv || !pv) { err.textContent = t("a_err_empty"); return; }
      err.textContent = ""; btn.disabled = true;
      try {
        await api(reg ? "/api/auth/register" : "/api/auth/login", reg ? { name: name.value.trim(), login: lv, password: pv } : { login: lv, password: pv });
        go(next || "/cabinet");

        err.textContent = ex.status === 409 ? t("a_err_taken") : ex.status === 429 ? t("a_err_many") : ex.status === 401 ? t("a_err_wrong") : t("error");
      } finally { btn.disabled = false; }
    });
    formBox.append(f);
  }
  drawTabs(); drawForm();
  wrap.append(tabs, formBox);
  return wrap;
}

function esc(x) { return String(x).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function inline(x) {
  return esc(x)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
// Small markdown subset for lesson texts: ### headings, paragraphs, * / - lists, 1. lists, ``` code blocks, `code`, **bold**, [links](https://…).
function md(text) {
  var out = [], lines = String(text || "").split("\n"), i = 0;
  while (i < lines.length) {
    var ln = lines[i];
    if (/^```/.test(ln)) {
      var code = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) code.push(lines[i++]);
      i++; out.push("<pre><code>" + esc(code.join("\n")) + "</code></pre>"); continue;
    }
    if (/^###\s+/.test(ln)) { out.push("<h3>" + inline(ln.replace(/^###\s+/, "")) + "</h3>"); i++; continue; }
    if (/^[*-]\s+/.test(ln)) {
      var items = [];
      while (i < lines.length && /^[*-]\s+/.test(lines[i])) items.push("<li>" + inline(lines[i++].replace(/^[*-]\s+/, "")) + "</li>");
      out.push("<ul>" + items.join("") + "</ul>"); continue;
    }
    if (/^\d+\.\s+/.test(ln)) {
      var oi = [];
      while (i < lines.length && /^\d+\.\s+/.test(lines[i])) oi.push("<li>" + inline(lines[i++].replace(/^\d+\.\s+/, "")) + "</li>");
      out.push("<ol>" + oi.join("") + "</ol>"); continue;
    }
    if (!ln.trim()) { i++; continue; }
    var para = [];
    while (i < lines.length && lines[i].trim() && !/^(```|###\s|[*-]\s|\d+\.\s)/.test(lines[i])) para.push(lines[i++]);
    out.push("<p>" + inline(para.join(" ")) + "</p>");
  }
  var d = h("div", { class: "md" }); d.innerHTML = out.join(""); return d;
}

    var g = grade(l.quiz, body.answers), ok = g.score >= 0.7;
    if (ok) { demoState.passed[c2.slug] = demoState.passed[c2.slug] || {}; demoState.passed[c2.slug][n] = true; }
    return Promise.resolve(Object.assign(g, { passed: ok }));
  }
  if ((m = path.match(/^\/api\/courses\/(\w+)\/exam$/))) {
    var c3 = find(m[1]); if (!c3) return Promise.reject(nf);
    var ready = c3.lessons.every(function (_, i) { return done(c3.slug).indexOf(i + 1) !== -1; });
    var have = cert("course", c3.slug), left = 5 - (demoState.attempts[c3.slug] || 0);
    if (!body) return Promise.resolve({ course: card(c3), ready: ready, attemptsLeft: left, certificate: have ? have.code : null, questions: ready ? strip(c3.exam) : [] });
    demoState.attempts[c3.slug] = (demoState.attempts[c3.slug] || 0) + 1;
    var g3 = grade(c3.exam, body.answers), passed = g3.score >= 0.7, code = have ? have.code : null, progs = [];
    var today = new Date().toISOString().slice(0, 19).replace("T", " ");
    if (passed && !code) {
      code = newCode();
      demoState.certs.push({ code: code, kind: "course", ref: c3.slug, title: c3.title, full_name: body.full_name, hours: c3.hours, score: Math.round(g3.score * 100), issued_at: today, revoked: 0 });
      P.forEach(function (p) {
        if (cert("program", p.slug) || !p.courses.every(function (s) { return cert("course", s); })) return;
        var pc = newCode(), hrs = p.courses.reduce(function (a, s) { return a + find(s).hours; }, 0);
        var sc = Math.round(p.courses.reduce(function (a, s) { return a + cert("course", s).score; }, 0) / p.courses.length);
        demoState.certs.push({ code: pc, kind: "program", ref: p.slug, title: p.title, full_name: body.full_name, hours: hrs, score: sc, issued_at: today, revoked: 0,
          courses: p.courses.map(function (s) { return find(s).title; }) });
        progs.push(pc);
      });
    }
    return Promise.resolve({ score: g3.score, right: g3.right, total: g3.total, passed: passed, certificate: passed ? code : null, programs: progs, attemptsLeft: left - 1 });
  }
  if ((m = path.match(/^\/api\/certs\/([A-Z0-9-]+)$/))) {
    var found = demoState.certs.find(function (c) { return c.code === m[1]; });
    if (found) return Promise.resolve({ certificate: found });
    if (m[1] === "SB-2026-SAMPLE01") return Promise.resolve({ certificate: { code: "SB-2026-SAMPLE01", kind: "course", ref: "excel", title: C[1].title, full_name: "Имя Фамилия", hours: C[1].hours, score: 88, issued_at: "2026-10-15 10:00:00", revoked: 0 } });
    return Promise.reject(nf);
  }
  return null;
}

// ---------------- cabinet ----------------
function badge(kind, status) { return h("span", { class: "badge b-" + status, text: t(kind + "_" + status) }); }
function fmtDate(s) { return s ? s.slice(0, 16).replace("T", " ") : ""; }
function personName(first, last, username) {

}
function trackName(id) { for (var i = 0; i < TRACKS.length; i++) if (TRACKS[i].id === id) return L(TRACKS[i]); return id; }

    logout));
  var tabs = [["learning", t("t_learning")], ["orders", t("t_orders")], ["profile", t("t_profile")]];

  var bar = h("div", { class: "tabs", role: "tablist" }), body = h("div", { class: "list" });

async function setStatus(id, status) {
  await api("/api/orders/" + id + "/status", { status: status });
  render();
}

function orderCard(o, as, extra) {
  var title;
  if (as === "client") title = o.specialist_name ? o.specialist_name + (o.specialist_title ? " — " + o.specialist_title : "") : t("spec_not_set");
  else title = t("client") + ": " + personName(o.client_first, o.client_last, o.client_username);
  var acts = h("div", { class: "actions" });
  function act(label, status, cls) { acts.append(h("button", { type: "button", class: "btn btn-sm " + (cls || "btn-line"), text: label, onclick: function () { this.disabled = true; setStatus(o.id, status).catch(function () { render(); }); } })); }
  if (as === "client" && (o.status === "new" || o.status === "accepted")) act(t("a_cancel"), "cancelled", "btn-danger");
  if (as === "spec" && o.status === "new") { act(t("a_accept"), "accepted", "btn-primary"); act(t("a_decline"), "declined", "btn-danger"); }
  if (as === "spec" && o.status === "accepted") act(t("a_done"), "done", "btn-primary");
  return h("div", { class: "ocard" },
    h("div", { class: "ohead" }, h("h3", { text: "№" + o.id + " · " + title }), badge("st", o.status)),
    h("p", { class: "otask", text: o.task }),
    h("div", { class: "ometa" },
      o.budget ? h("span", { text: t("budget") + ": " + o.budget }) : null,
      o.deadline ? h("span", { text: t("deadline") + ": " + o.deadline }) : null,
      as !== "client" && o.contact ? h("span", { text: t("contact") + ": " + o.contact }) : null,
      h("span", { text: t("created") + ": " + fmtDate(o.created_at) })),
    extra || null,
    acts.childNodes.length ? acts : null);
}

async function tabOrders(body) {

function passwordBox() {
  var err = h("p", { class: "err", "aria-live": "polite" }), ok = h("p", { class: "ok", hidden: true });
  var o = h("input", { type: "password", autocomplete: "current-password", maxlength: "200" });
  var n1 = h("input", { type: "password", autocomplete: "new-password", maxlength: "200" });
  var n2 = h("input", { type: "password", autocomplete: "new-password", maxlength: "200" });
  var btn = h("button", { class: "btn btn-line", type: "submit", text: t("a_change") });
  var f = h("form", { class: "formbox", novalidate: true }, h("h3", { text: t("a_change_h") }),
    h("p", { class: "hint", text: t("a_login") + ": " + me.user.login }),
    h("div", { class: "row" }, h("label", null, t("a_old"), o), h("label", null, t("a_new"), n1)),
    h("label", null, t("a_pass2"), n2), err, ok, h("div", null, btn));
  f.addEventListener("submit", async function (e) {
    e.preventDefault(); ok.hidden = true;
    if (n1.value.length < 8) { err.textContent = t("a_err_pass"); return; }
    if (n1.value !== n2.value) { err.textContent = t("a_err_pass2"); return; }
    err.textContent = ""; btn.disabled = true;
    try { await api("/api/auth/password", { old_password: o.value, new_password: n1.value }); ok.hidden = false; ok.textContent = t("a_changed"); f.reset(); }
    catch (ex) { err.textContent = ex.status === 403 ? t("a_err_old") : t("error"); }
    finally { btn.disabled = false; }
  });
  return f;
}

async function tabProfile(body) {
  var p = me.profile || {};

  var catSel = h("select", { id: "p-cat" });
  CATS.slice(1).forEach(function (c) { catSel.append(h("option", { value: c.id, text: c[lang] })); });

    h("div", { class: "row" },

      h("label", null, t("p_portfolio"), h("input", { id: "p-portfolio", maxlength: "300", placeholder: "https://", value: p.portfolio || "" }))),
    err, ok, h("div", null, btn));
  form.addEventListener("submit", async function (e) {

      var r = await api("/api/profile", { name: val("#p-name"), title: val("#p-title"), category: catSel.value, skills: val("#p-skills"),
        price: val("#p-price"), city: val("#p-city"), portfolio: val("#p-portfolio") });
      me.profile = r.profile; ok.hidden = false; ok.textContent = t("p_saved");
      var st = form.querySelector(".badge"); if (st) st.replaceWith(badge("ps", r.profile.status));
    } catch (ex) { err.textContent = ex.status === 401 ? t("need_login") : t("error"); }
    finally { btn.disabled = false; }
  });
  body.append(form);
  if (me.user.login && me.user.id !== -1) body.append(passwordBox());
}

  body.append(h("h2", { text: t("adm_pending"), style: "margin-top:12px" }));
